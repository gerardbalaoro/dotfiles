[dotfiles]
"~/.bashrc" = { source = "tools/shell/bashrc", mode = "copy" }
"~/.zshrc" = { source = "tools/shell/zshrc", mode = "copy" }
"~/.profile" = { source = "tools/shell/profile.tera", mode = "template" }
"~/.bash_profile" = { mode = "absent" }
"~/.bash_login" = { mode = "absent" }
"~/.zprofile" = { mode = "absent" }

[tasks."setup:unix"]
description = "Generate Bash and Zsh integrations"
run = "sh tools/shell/setup.sh"
