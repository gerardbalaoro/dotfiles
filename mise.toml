#:schema https://mise.jdx.dev/schema/mise.json
min_version = "2026.10.21"

# Shared tools are also copied to the user's global mise configuration.
include = [
  "layers/common/home/dot-config/mise/conf.d/dev.toml",
  "layers/common/home/dot-config/mise/conf.d/ai.toml",
  "layers/common/home/dot-config/mise/conf.d/utils.toml",
]

[vars]
home = "{% if os() == 'windows' %}{{ env.USERPROFILE | replace(from='\\\\', to='/') }}{% else %}{{ env.HOME }}{% endif %}"
is_wsl = "false"

[bootstrap.secrets]
git_email = "DOTFILES_GIT_EMAIL"
ssh_public_key = "DOTFILES_SSH_PUBLIC_KEY"
ssh_private_key = "DOTFILES_SSH_PRIVATE_KEY"

[settings]
minimum_release_age = "1d"

[settings.npm]
package_manager = "aube"

[settings.dotfiles]
root = "{{ config_root }}/layers"

# Ordinary files are discovered automatically; only templates and private files
# need entries. Every target belongs to exactly one selected layer.
[dotfile_groups.common]
root = "common/home"
mode = "copy"
dot_prefix = true
exclude = [
  "*.tera", ".gitkeep", "node_modules", "dist", ".git", "__pycache__", "*.pyc",
  ".venv", ".virtualenvs", ".env", ".cache", ".coverage", "*.log",
]

[dotfile_groups.common.entries]
"~/.gitconfig" = { mode = "template" }
"~/.config/skillshare/config.yaml" = { mode = "template" }
"~/.ssh" = { permissions = "0700" }
"~/.ssh/config" = { mode = "template", permissions = "0600" }
"~/.ssh/id_ed25519" = { mode = "template", permissions = "0600" }
"~/.ssh/id_ed25519.pub" = { mode = "template", permissions = "0644" }
"~/.ssh/authorized_keys" = { mode = "template", permissions = "0600" }
"~/.ssh/allowed_signers" = { mode = "template", permissions = "0644" }

[tasks."setup:common"]
description = "Install shared fonts"
run = "bash layers/common/setup.sh"
run_windows = "powershell -NoProfile -ExecutionPolicy Bypass -File layers/common/setup.ps1"

[tasks.bootstrap]
description = "Run setup for every selected layer after packages, dotfiles and tools"
depends = ["setup:*"]
