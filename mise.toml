#:schema https://mise.jdx.dev/schema/mise.json
min_version = "2026.10.21"

# Shared tools are also copied to the user's global mise configuration.
include = [
  "tools/mise/conf.d/dev.toml",
  "tools/mise/conf.d/ai.toml",
  "tools/mise/conf.d/utils.toml",
]

[vars]
dotfiles_checkout = "{{ config_root }}"
home = "{% if os() == 'windows' %}{{ env.USERPROFILE | replace(from='\\\\', to='/') }}{% else %}{{ env.HOME }}{% endif %}"
is_wsl = "false"

[settings]
minimum_release_age = "1d"

[settings.npm]
package_manager = "aube"

[settings.dotfiles]
root = "{{ config_root }}"

# Tool bundles copy ordinary files; templates have explicit targets.
[dotfile_groups.mise]
root = "tools/mise"
target = "~/.config/mise"
mode = "copy"
exclude = ["*.tera", "mise.lock"]

[dotfile_groups.mise.entries]
"~/.config/mise/conf.d/dotfiles.toml" = { mode = "template" }

[dotfile_groups.skillshare]
root = "tools/skillshare"
target = "~/.config/skillshare"
mode = "copy"
dot_prefix = true
exclude = ["*.tera", ".gitkeep", "node_modules", ".git", "__pycache__", "*.pyc"]

[dotfile_groups.skillshare.entries]
"~/.config/skillshare/config.yaml" = { mode = "template" }

[dotfiles]
"~/.agents/AGENTS.md" = { source = "tools/agents/AGENTS.md", mode = "copy" }
"~/.config/git/config" = { source = "tools/git/config.tera", mode = "template" }
"~/.config/oh-my-posh/main.omp.json" = { source = "tools/oh-my-posh/main.omp.json", mode = "copy" }
"~/.ssh" = { permissions = "0700" }
"~/.ssh/config" = { source = "tools/ssh/config.tera", mode = "template", permissions = "0600" }
"~/.ssh/authorized_keys" = { source = "tools/ssh/authorized_keys.tera", mode = "template", permissions = "0600" }

[tasks.bootstrap]
description = "Run setup for the selected machine environments"
depends = ["setup:*"]
