include = ["layers/windows/packages.toml"]

[dotfile_groups.windows]
root = "windows/home"
mode = "copy"
exclude = ["*.tera"]

[dotfile_groups.windows.entries]
"~/AppData/Local/clink/clink_settings" = { mode = "template" }

[bootstrap.hooks]
# Native launchers otherwise pass PowerShell 7's module paths to Windows PowerShell.
post-packages = 'set "PSModulePath=" && powershell -NoProfile -ExecutionPolicy Bypass -File "{{ config_root }}/layers/windows/packages.ps1"'

[tasks."setup:common".env]
PSModulePath = false

[tasks."setup:windows"]
description = "Apply Windows preferences, desktop apps and tool shims"
depends = ["setup:common"]
env = { PSModulePath = false }
run = "powershell -NoProfile -ExecutionPolicy Bypass -File layers/windows/setup.ps1"
