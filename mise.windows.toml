include = ["environments/windows/packages.toml"]

[dotfiles]
"~/AppData/Local/clink/clink_settings" = { source = "tools/clink/settings.tera", mode = "template" }
"~/Documents/PowerShell/Microsoft.PowerShell_profile.ps1" = { source = "tools/powershell/profile.ps1", mode = "copy" }
"~/Documents/WindowsPowerShell/Microsoft.PowerShell_profile.ps1" = { source = "tools/powershell/profile.windows-powershell.ps1", mode = "copy" }

[bootstrap.hooks]
# Native launchers otherwise pass PowerShell 7's module paths to Windows PowerShell.
post-packages = 'set "PSModulePath=" && powershell -NoProfile -ExecutionPolicy Bypass -File "{{ config_root }}/environments/windows/packages.ps1"'

[tasks."setup:windows"]
description = "Configure Windows tool shims"
env = { PSModulePath = false }
run = "powershell -NoProfile -ExecutionPolicy Bypass -File environments/windows/setup.ps1"
