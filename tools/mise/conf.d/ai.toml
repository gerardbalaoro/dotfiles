#:schema https://mise.jdx.dev/schema/mise.json

[tools]
"npm:agentsrc" = { version = "latest", minimum_release_age = "0s", allow_builds = true }
"npm:agent-browser" = { version = "latest", allow_builds = true }
"npm:agent-desktop" = { version = "latest", allow_builds = true }
"npm:ctx7" = { version = "latest", allow_builds = true }
"npm:@opencode/browse" = { version = "latest", minimum_release_age = "0s", allow_builds = true }
"npm:@gblab/skm" = { version = "latest", minimum_release_age = "0s", allow_builds = true }

[tools.claude]
version = "latest"
minimum_release_age = "0s"

[tools.codex]
version = "latest"
minimum_release_age = "0s"

[tools.opencode]
version = "latest"
allow_builds = true
minimum_release_age = "0s"

[bootstrap.hooks.final]
description = "Sync shared agent skills and MCP configuration"
run = "mise exec -- arc sync -g -y"
