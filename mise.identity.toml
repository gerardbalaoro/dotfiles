[bootstrap.secrets]
git_email = "DOTFILES_GIT_EMAIL"
ssh_public_key = "DOTFILES_SSH_PUBLIC_KEY"
ssh_private_key = "DOTFILES_SSH_PRIVATE_KEY"

[dotfiles]
"~/.config/git/identity" = { source = "tools/git/identity.tera", mode = "template", permissions = "0600" }
"~/.ssh/id_ed25519" = { source = "tools/ssh/id_ed25519.tera", mode = "template", permissions = "0600" }
"~/.ssh/id_ed25519.pub" = { source = "tools/ssh/id_ed25519.pub.tera", mode = "template", permissions = "0644" }
"~/.ssh/allowed_signers" = { source = "tools/ssh/allowed_signers.tera", mode = "template", permissions = "0644" }
