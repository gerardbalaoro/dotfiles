#:schema https://mise.jdx.dev/schema/mise.json

# mise applies only managers available on the host. Homebrew is handled by
# bootstrap/macos.sh so Intel Macs retain the same package support.
[bootstrap.apt.sources]
git-core = { ppa = "git-core/ppa" }

