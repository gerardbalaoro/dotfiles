#:schema https://mise.jdx.dev/schema/mise.json

[tools]
aube = "latest"
bun = "latest"
deno = "latest"
node = "26"
pnpm = "latest"
viteplus = "latest"
uv = { version = "latest", post_install = "uv python install --default" }

[env]
PNPM_HOME = "{% if os() == 'windows' %}{{ env.LOCALAPPDATA }}/pnpm{% else %}{{ env.HOME }}/.local/share/pnpm{% endif %}"
_.path = [
  "{{ env.PNPM_HOME }}",
  "{{ env.PNPM_HOME }}/bin",
]

[shell_alias]
bunx = "bun x"
pnpx = "pnpm dlx"
